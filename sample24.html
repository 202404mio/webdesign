       <h1>メレンゲの作り方と材料</h1>
　　　　 <p>ハンドミキサーを使ったメレンゲの作り方と材料を紹介します。</p>
       <h2>の作り方</h2>
       <p>家庭でもできるハンドミキサーを使ったメレンゲの作り方を紹介します。</p>
       <ol>
          <li>ボウルに<ruby>卵白<rt>らんぱく</rt></ruby>を入れる。</li>
          <li>ハンドミキサーの<mark>最速</mark>で全体に空気を含ませるように混ぜる。</li>
         　<li>グラニュー糖を3回程度に分けて入れ、各30秒程度混ぜる。</li>
      </ol>
      <h2>メレンゲの材料</h2>
      <ul>
         <li>よく<mark>冷やした</mark>卵(<ruby>卵白<rt>らんぱく</rt></ruby>のみ使用)</li>
         <li>(卵１つあたりg)</li>
      </ul>
